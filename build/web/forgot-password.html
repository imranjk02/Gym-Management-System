<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | FitCore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-brand">
        <a href="index.html" class="logo">FIT<span>CORE</span></a>
        <p>GYM MANAGEMENT SYSTEM</p>
    </div>

    <div class="auth-card">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>Forgot Password?</h1>
        <p class="auth-subtitle">Enter your email address to request password recovery.</p>

        <form id="forgotForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="forgotEmail" placeholder="admin@example.com" required>
            </div>

            <button type="submit" class="btn login-btn">Send Recovery Request</button>
        </form>

        <p id="forgotMessage" class="login-message"></p>

        <div class="auth-footer">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
